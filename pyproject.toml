[project]
name = "legisrag"
version = "0.1.0"
description = "RAG sobre legislação brasileira (LGPD e CDC) com busca híbrida, citações verificáveis e avaliação automatizada."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.13",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "numpy>=1.26",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
legisrag = "legisrag.cli:app"

# No Linux (CI e Docker), usa o PyTorch só-CPU: evita baixar ~3 GB de bibliotecas CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legisrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Padrão do Typer: as opções da CLI são declaradas como valores padrão dos argumentos.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
