name: Avaliação

# Avaliação de recuperação: roda quando algo que afeta a busca muda, e falha se o modo de busca
# padrão piorar em relação ao baseline versionado. A avaliação de geração chama a API do Claude
# (tem custo), por isso só roda manualmente, marcando a opção ao disparar o workflow.

on:
  pull_request:
    paths: &eval-paths
      - "src/**"
      - "data/processed/**"
      - "eval/dataset.jsonl"
      - "eval/results/e5-large-dense.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths: *eval-paths
  workflow_dispatch:
    inputs:
      generation:
        description: "Também avaliar a geração (chama a API do Claude; tem custo)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ao trocar o modelo de embeddings ou o modo de busca padrão, gere um novo baseline
  # (`legisrag eval --name <nome>`) e atualize este caminho e o de `paths` acima.
  BASELINE: eval/results/e5-large-dense.json
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TOKENIZERS_PARALLELISM: "false"

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --frozen

      # O modelo de embeddings tem ~2 GB; o cache evita baixá-lo a cada execução.
      # A chave muda junto com config.py, onde o modelo padrão é definido.
      - name: Cache do modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ runner.os }}-${{ hashFiles('src/legisrag/config.py') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Criar índice
        run: uv run legisrag index

      - name: Avaliar recuperação
        run: >
          uv run legisrag eval --name ci
          --baseline "$BASELINE"
          --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Avaliar geração
        if: github.event_name == 'workflow_dispatch' && inputs.generation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          uv run legisrag eval --generation --name ci-generation
          --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/ci*.json
          if-no-files-found: ignore
