name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes
        run: uv run pytest -q
